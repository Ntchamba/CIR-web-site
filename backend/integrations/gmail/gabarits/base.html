<!DOCTYPE html>
<html lang="{{ langue|default:'fr' }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titre }}</title></head>
<body style="margin:0;padding:0;background:#F3F7F9;font-family:Figtree,Arial,Helvetica,sans-serif;color:#0E2A38;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F7F9;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:8px;">
<tr><td style="background:#0E2A38;color:#ffffff;padding:20px 28px;font-family:Lora,Georgia,serif;font-size:20px;">CIR</td></tr>
<tr><td style="padding:28px;font-size:16px;line-height:1.5;color:#0E2A38;">
<h1 style="margin:0 0 16px;font-family:Lora,Georgia,serif;font-size:22px;color:#0E2A38;">{{ titre }}</h1>
<div>{{ corps_html }}</div>
{% if lien %}<p style="margin:24px 0 0;"><a href="{{ lien }}" style="display:inline-block;background:#FF6D4C;color:#0E2A38;text-decoration:none;font-weight:bold;padding:14px 24px;border-radius:6px;min-height:20px;">{{ libelle_lien|default:lien }}</a></p>
<p style="margin:12px 0 0;font-size:13px;color:#1177A8;word-break:break-all;"><a href="{{ lien }}" style="color:#1177A8;">{{ lien }}</a></p>{% endif %}
</td></tr>
<tr><td style="padding:16px 28px;font-size:12px;line-height:1.5;color:#0E2A38;border-top:1px solid #F3F7F9;">
{% if pied %}<div>{{ pied }}</div>{% endif %}
{% if lien_desabonnement %}<div style="margin-top:8px;"><a href="{{ lien_desabonnement }}" style="color:#1177A8;">{{ lien_desabonnement }}</a></div>{% endif %}
</td></tr>
</table></td></tr></table>
</body></html>
